name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23C084FC&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE
            dist/snake-light.svg?color_snake=%230891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2

      - name: Crop top padding so snake stays inside contribution boxes
        run: |
          python3 -c "
          import re, glob
          for path in glob.glob('dist/*.svg'):
              with open(path, 'r', encoding='utf-8') as f:
                  data = f.read()
              # Shift SVG viewBox starting Y from 0 to 28 so top margin above boxes is cropped
              data = re.sub(r'viewBox=\"0 0 (\d+) (\d+)\"', r'viewBox=\"0 28 \1 \2\"', data)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(data)
          print('Cropped top padding successfully')
          "

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
